<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Номера — Lotte Hotel Moscow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #faf8f5);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0ece5);
    --text: var(--tg-theme-text-color, #1c1a17);
    --hint: var(--tg-theme-hint-color, #8a8378);
    --link: var(--tg-theme-link-color, #9a7b4f);
    --button: var(--tg-theme-button-color, #1c1a17);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --accent: #9a7b4f;
    --border: rgba(28, 26, 23, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #app { min-height: 100vh; padding-bottom: 24px; }

  header.top {
    padding: 20px 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  header.top .title { font-size: 20px; font-weight: 600; letter-spacing: 0.2px; }
  header.top .subtitle { font-size: 13px; color: var(--hint); margin-top: 2px; }

  .lang-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    color: var(--hint);
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .lang-toggle button.active { background: var(--text); color: var(--bg); }

  .view { display: none; }
  .view.active { display: block; }

  .cards { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--secondary-bg);
    border-radius: 14px;
    padding: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .card .thumb {
    width: 72px;
    height: 72px;
    border-radius: 10px;
    flex-shrink: 0;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent), #cbb897);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 10px;
    text-align: center;
    line-height: 1.3;
  }

  .card .body { flex: 1; min-width: 0; }
  .card .name { font-size: 15px; font-weight: 600; }
  .card .facts { font-size: 12.5px; color: var(--hint); margin-top: 3px; }
  .card .price { font-size: 12.5px; color: var(--accent); margin-top: 4px; font-weight: 500; }
  .card .chevron { color: var(--hint); font-size: 18px; flex-shrink: 0; }

  #view-detail { padding: 0 16px 16px; }

  .detail-photo {
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent), #cbb897);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.9);
    font-size: 13px;
    text-align: center;
    padding: 20px;
    margin-top: 8px;
  }

  .detail-name { font-size: 22px; font-weight: 700; margin-top: 16px; }
  .detail-tagline { font-size: 14px; color: var(--hint); margin-top: 4px; }

  .fact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 18px;
  }
  .fact {
    background: var(--secondary-bg);
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--border);
  }
  .fact .label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.4px; }
  .fact .value { font-size: 14.5px; font-weight: 600; margin-top: 3px; }

  .amenities { margin-top: 18px; }
  .amenities .h { font-size: 13px; color: var(--hint); margin-bottom: 8px; }
  .amenity-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font-size: 12.5px;
    padding: 6px 10px;
    background: var(--secondary-bg);
    border: 1px solid var(--border);
    border-radius: 100px;
  }

  .detail-price { margin-top: 18px; font-size: 15px; }
  .detail-price .amount { font-weight: 700; }

  .source-link { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--accent); text-decoration: none; }

  .placeholder-note {
    margin-top: 20px;
    font-size: 11.5px;
    color: var(--hint);
    border-top: 1px dashed var(--border);
    padding-top: 10px;
  }

  .fallback-banner {
    margin: 12px 16px 0;
    padding: 10px 12px;
    background: #fff3cd;
    color: #6b5300;
    border-radius: 10px;
    font-size: 12px;
    display: none;
  }
</style>

<div id="app">
  <div class="fallback-banner" id="fallbackBanner">
    Просмотр вне Telegram — часть функций (кнопки Telegram, тема) недоступна. Откройте через бота, чтобы увидеть настоящий вид.

    </div>
    <div class="lang-toggle">
      <button id="btnRu" class="active">RU</button>
      <button id="btnEn">EN</button>

  </header>

  </div>

  <div id="view-detail" class="view">

    <div class="detail-name" id="detailName"></div>
    <div class="detail-tagline" id="detailTagline"></div>

    <div class="fact-grid" id="detailFacts"></div>

    <div class="amenities">

    <div class="detail-price" id="detailPrice"></div>
    <a class="source-link" id="detailSource" target="_blank">Страница номера на сайте отеля ↗</a>

    <div class="placeholder-note" id="placeholderNote"></div>
  </div>
</div>

  function renderCards() {
    cardsEl.innerHTML = '';
    categories.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'card';
      var thumbHtml = c.photo
        ? '<img class="thumb" src="' + c.photo + '" onerror="this.outerHTML=\'<div class=&quot;thumb&quot;>' + (lang === 'ru' ? 'ФОТО' : 'PHOTO') + '</div>\'">'
        : '<div class="thumb">' + (lang === 'ru' ? 'ФОТО' : 'PHOTO') + '</div>';
      card.innerHTML =
        thumbHtml +
        '<div class="body">' +
          '<div class="name">' + c.name[lang] + '</div>' +
          '<div class="facts">' + c.area[lang] + ' · ' + c.bed[lang] + '</div>' +
          '<div class="price">' + strings[lang].price + '</div>' +
        '</div>' +
        '<div class="chevron">›</div>';
      card.addEventListener('click', function () { openDetail(c); });
      cardsEl.appendChild(card);
    });
  }

  function openDetail(c) {
    var photoWrap = document.getElementById('detailPhotoWrap');
    if (c.photo) {
      photoWrap.innerHTML = '<img class="detail-photo" src="' + c.photo + '" onerror="this.outerHTML=\'<div class=&quot;detail-photo&quot;>' + strings[lang].photoMissing + '</div>\'">';
    } else {
      photoWrap.innerHTML = '<div class="detail-photo">' + strings[lang].photoMissing + '</div>';
    }

    document.getElementById('detailName').textContent = c.name[lang];
    document.getElementById('detailTagline').textContent = c.tagline[lang];

    var facts = document.getElementById('detailFacts');
    facts.innerHTML = '';
    var pairs = [
      [lang === 'ru' ? 'Площадь' : 'Area', c.area[lang]],
      [lang === 'ru' ? 'Кровать' : 'Bed', c.bed[lang]],
      [lang === 'ru' ? 'Вид' : 'View', c.view[lang]],
      [lang === 'ru' ? 'Код PMS' : 'PMS code', c.pms]
    ];
    pairs.forEach(function (p) {
      var f = document.createElement('div');
      f.className = 'fact';
      f.innerHTML = '<div class="label">' + p[0] + '</div><div class="value">' + p[1] + '</div>';
      facts.appendChild(f);
    });

    document.getElementById('amenitiesLabel').textContent = strings[lang].amenitiesLabel;
    var am = document.getElementById('detailAmenities');
    am.innerHTML = '';
    c.amenities[lang].forEach(function (a) {
      var pill = document.createElement('div');
      pill.className = 'pill';
      pill.textContent = a;
      am.appendChild(pill);
    });

    document.getElementById('detailPrice').innerHTML = '<span class="amount">' + strings[lang].price + '</span>';
    document.getElementById('detailSource').href = c.source;
    document.getElementById('detailSource').textContent = (lang === 'ru' ? 'Страница номера на сайте отеля' : 'Room page on hotel website') + ' ↗';
    document.getElementById('placeholderNote').textContent = strings[lang].note;

    viewList.classList.remove('active');
    viewDetail.classList.add('active');

    if (tg) {
      tg.BackButton.show();
      tg.MainButton.setText(strings[lang].mainBtn);
      tg.MainButton.show();
      tg.MainButton.offClick(mainButtonHandler);
      tg.MainButton.onClick(mainButtonHandler);
    }
  }

  function mainButtonHandler() {
    if (tg && tg.sendData) {
      try { tg.sendData(JSON.stringify({ action: 'ask_about_room' })); } catch (e) {}
    }
  }

  function backToList() {
    viewDetail.classList.remove('active');
    viewList.classList.add('active');
    if (tg) {
      tg.BackButton.hide();
      tg.MainButton.hide();
    }
  }

  if (tg) {
    tg.BackButton.onClick(backToList);
  }

  function setLang(newLang) {
    lang = newLang;
    document.getElementById('btnRu').classList.toggle('active', lang === 'ru');
    document.getElementById('btnEn').classList.toggle('active', lang === 'en');
    document.getElementById('hotelSubtitle').textContent = strings[lang].subtitle;
    renderCards();
  }

  document.getElementById('btnRu').addEventListener('click', function () { setLang('ru'); });
  document.getElementById('btnEn').addEventListener('click', function () { setLang('en'); });

  renderCards();
})();
</script>
</body>
</html>
